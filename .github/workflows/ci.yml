name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: "24"
          cache: true

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Build
        run: vp build
